[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "my-trading-bot"
version = "0.1.0"
description = "Upload a trading-style document and the bot compiles it into real trade-entry criteria."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dre Antic" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2",
  "python-multipart>=0.0.12",
  "ccxt>=4",
  "pandas>=2.2",
  "numpy>=2",
  "pypdf>=5",
  "python-docx>=1.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradingbot = "tradingbot.cli:main"

[tool.setuptools.packages.find]
include = ["tradingbot*"]

[tool.setuptools.package-data]
tradingbot = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
