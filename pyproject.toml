[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI command center for an Intel Mac"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JARVIS" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pillow>=11",
  "numpy>=2",
  "httpx>=0.27",
  "pydantic>=2",
  "cryptography>=43",
  "pywebview>=5",
  "keyring>=25",
  "ddgs>=9",
  "trafilatura>=2",
  "python-multipart>=0.0.12",
  "aiofiles>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.launch:main"
ai-video-studio = "aivideostudio.launch:main"

[tool.setuptools.packages.find]
where = [".", "engine"]
include = ["jarvis*", "aivideostudio*"]
exclude = ["tests*", "desktop*", "docs*"]

[tool.setuptools.package-data]
jarvis = ["web/**/*"]
aivideostudio = ["web/**/*", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "engine"]
filterwarnings = ["ignore::DeprecationWarning"]
