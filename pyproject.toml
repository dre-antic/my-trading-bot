[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-studio"
version = "1.0.0"
description = "Native-feeling AI video production studio for macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Video Studio" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pillow>=11",
  "numpy>=2",
  "httpx>=0.27",
  "pydantic>=2",
  "cryptography>=43",
  "pywebview>=5",
  "keyring>=25",
  "ddgs>=9",
  "trafilatura>=2",
  "python-multipart>=0.0.12",
  "aiofiles>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-video-studio = "aivideostudio.launch:main"

[tool.setuptools.packages.find]
where = ["engine"]

[tool.setuptools.package-data]
aivideostudio = ["web/**/*", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["engine"]
filterwarnings = ["ignore::DeprecationWarning"]
