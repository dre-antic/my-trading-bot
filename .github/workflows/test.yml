name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ffmpeg and espeak-ng
        run: |
          # GitHub-hosted runners ship a Google Chrome apt source that can fail
          # apt-get update with a hash-sum mismatch. We do not need Chrome.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome-stable.list
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - run: npm ci
      - run: npm test
