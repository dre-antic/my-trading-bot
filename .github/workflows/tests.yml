name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Resourceful-problem-solving skill
        run: |
          python3 skills-dev/resourceful-problem-solving/scripts/validate_skill.py .agents/skills/resourceful-problem-solving
          python3 skills-dev/resourceful-problem-solving/scripts/test_validate_skill.py
          python3 skills-dev/resourceful-problem-solving/evals/test_fixtures.py
      - name: Unit, failure, integration
        run: pytest tests/unit tests/failure tests/integration -q
      - name: End-to-end video
        run: pytest tests/e2e -q --tb=short
